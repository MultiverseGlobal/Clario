services:
  - type: web
    name: clario-media-worker
    env: docker
    dockerfilePath: ./worker/Dockerfile
    dockerContext: ./worker
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
