<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clario — Asset Intelligence & Clean Sourcing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        background: #0E1117;
        color: #F8F7F4;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .skeleton-shimmer {
        background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; background: #0E1117;">
        <div style="height: 56px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 24px;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 28px; height: 28px; border-radius: 6px; background: #4E6CF2;"></div>
            <div style="width: 80px; height: 16px; border-radius: 4px;" class="skeleton-shimmer"></div>
          </div>
          <div style="width: 280px; height: 24px; border-radius: 12px;" class="skeleton-shimmer"></div>
          <div style="width: 90px; height: 32px; border-radius: 6px;" class="skeleton-shimmer"></div>
        </div>
        <div style="max-width: 960px; width: 100%; margin: 40px auto; padding: 0 24px; display: flex; flex-direction: column; gap: 20px;">
          <div style="width: 240px; height: 28px; border-radius: 6px;" class="skeleton-shimmer"></div>
          <div style="width: 100%; height: 200px; border-radius: 14px;" class="skeleton-shimmer"></div>
          <div style="width: 100%; height: 180px; border-radius: 14px;" class="skeleton-shimmer"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
